services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  storage:
    image: chrislusf/seaweedfs:4.53
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: formshiftlocal
      AWS_SECRET_ACCESS_KEY: formshift-local-dev-password
      S3_BUCKET: formshift-temp
    ports: ["127.0.0.1:9000:8333"]
    volumes: ["seaweed-data:/data"]
  storage-init:
    build:
      context: .
      dockerfile: infra/storage-init/Dockerfile
    environment:
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: formshift-temp
      STORAGE_ACCESS_KEY_ID: formshiftlocal
      STORAGE_SECRET_ACCESS_KEY: formshift-local-dev-password
      WEB_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on: [storage]
    restart: "no"
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://storage:8333
      WORKER_STL_ENGINE: native
      WORKER_SANDBOX: trusted-local
    depends_on:
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    mem_limit: ${WORKER_CONTAINER_MEMORY:-3g}
    cpus: 1.0
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 30s
    restart: "on-failure:3"
volumes:
  redis-data:
  seaweed-data:
