services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: formshiftlocal
      MINIO_ROOT_PASSWORD: formshift-local-dev-password
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 formshiftlocal formshift-local-dev-password; do sleep 2; done
        mc mb --ignore-existing local/formshift-temp
        mc ilm rule add --expire-days 2 local/formshift-temp
    restart: "no"
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      WORKER_STL_ENGINE: native
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 30s
    restart: "on-failure:3"
volumes:
  redis-data:
  minio-data:
